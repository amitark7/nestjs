name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_management
          MYSQL_USER: taskuser
          MYSQL_PASSWORD: taskpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: taskuser
          DB_PASSWORD: taskpassword
          DB_DATABASE: task_management
          DB_SYNCHRONIZE: true
          JWT_SECRET: test-jwt-secret-which-is-at-least-32-characters
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test-refresh-secret-which-is-at-least-32-characters
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_URL: redis://127.0.0.1:6379
